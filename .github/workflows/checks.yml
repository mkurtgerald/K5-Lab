name: Generic checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Publication boundary
        run: python tools/check_public.py --index
      - name: Release provenance consistency
        run: python tools/check_release_provenance.py
      - name: Release SBOM consistency
        run: python tools/check_release_sbom.py
      - name: Release license and notices boundary
        run: python tools/check_release_licenses.py
      - name: Native release boundary
        run: python tools/check_native_release.py
      - name: Adapter contract consistency
        run: python tools/check_adapter_contract.py
      - name: Release security/privacy boundary
        run: python tools/check_release_security.py
      - name: Package metadata boundary
        run: python tools/check_package_metadata.py
      - name: Install explicit core versions
        run: python -m pip install --disable-pip-version-check -r requirements-core.txt
      - name: Tests
        run: python tools/run_tests.py
      - name: Package artifact lifecycle
        run: python tools/run_package_lifecycle.py
      - name: Synthetic baseline smoke
        run: python tools/run_benchmark.py --samples 600
      - name: Constrained allocation smoke
        run: python tools/run_allocation_benchmark.py
      - name: Generic simulation baseline
        run: python tools/run_simulation_benchmark.py --horizon 64
      - name: Streaming drift smoke
        run: python tools/run_stream_benchmark.py --samples 600
      - name: Streaming quality smoke
        run: python tools/run_stream_quality.py --samples 600
      - name: Streaming multi-seed acceptance
        run: python tools/run_stream_multiseed.py --samples 600
      - name: Streaming robustness multi-seed acceptance
        run: python tools/run_stream_robustness.py --samples 600 --multi-seed
      - name: Native runtime inventory and RSS smoke
        run: python tools/run_native_inventory.py
      - name: Bounded memory and correlation smoke
        run: python tools/run_memory_benchmark.py --samples 512
      - name: Memory eviction and rejection stress
        run: python tools/run_memory_stress.py
      - name: Confidence and evidence multi-seed smoke
        run: python tools/run_confidence_benchmark.py --samples 600
      - name: Cross-stage failure-path qualification
        run: python tools/run_failure_paths.py
