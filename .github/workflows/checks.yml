name: Generic checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Publication boundary
        run: python tools/check_public.py --index
      - name: Install explicit core versions
        run: python -m pip install --disable-pip-version-check -r requirements-core.txt
      - name: Tests
        run: python tools/run_tests.py
      - name: Synthetic baseline smoke
        run: python tools/run_benchmark.py --samples 600
      - name: Constrained allocation smoke
        run: python tools/run_allocation_benchmark.py
      - name: Streaming drift smoke
        run: python tools/run_stream_benchmark.py --samples 600
      - name: Streaming quality smoke
        run: python tools/run_stream_quality.py --samples 600
      - name: Streaming multi-seed acceptance
        run: python tools/run_stream_multiseed.py --samples 600
      - name: Streaming robustness observation
        run: python tools/run_stream_robustness.py --samples 600 --seed 31
      - name: Native runtime inventory and RSS smoke
        run: python tools/run_native_inventory.py
